name: Bug report
description: Report a reproducible problem in the Dify overlay or builder tooling.
title: "[Bug]: "
labels:
  - "type: bug"
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "priority: p0"
        - "priority: p1"
        - "priority: p2"
        - "priority: p3"
        - "priority: p4"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "area: docs"
        - "area: platform"
        - "area: client"
        - "area: service"
        - "area: operations"
        - "area: security"
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Release classification
      options:
        - "release: none"
        - "release: notes"
        - "release: platform"
        - "release: client"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API overlay
        - Web overlay
        - Operator builder
        - Source provenance
        - Validation automation
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe what happened and the impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide validation steps that do not publish images.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Dify and overlay versions
      placeholder: Dify 1.15.0, overlay 1.15.0-kc-v15
  - type: textarea
    id: diagnostics
    attributes:
      label: Relevant diagnostics
      description: Redact registry credentials, tokens, personal data, and sensitive configuration.
      render: shell
