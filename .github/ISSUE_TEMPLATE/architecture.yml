name: Architecture proposal
description: Propose an overlay, builder, or upstream contract decision.
title: "[Architecture]: "
labels:
  - "type: architecture"
body:
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "priority: p0"
        - "priority: p1"
        - "priority: p2"
        - "priority: p3"
        - "priority: p4"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - "area: docs"
        - "area: platform"
        - "area: client"
        - "area: service"
        - "area: operations"
        - "area: security"
    validations:
      required: true
  - type: dropdown
    id: release
    attributes:
      label: Release classification
      options:
        - "release: none"
        - "release: notes"
        - "release: platform"
        - "release: client"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - API overlay
        - Web overlay
        - Operator builder
        - Source provenance
        - Developer experience
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and problem
      description: Describe the current contract and reason a decision is needed.
    validations:
      required: true
  - type: textarea
    id: decision
    attributes:
      label: Proposed decision
      description: State ownership, boundaries, upstream relationship, and intended end state.
    validations:
      required: true
  - type: textarea
    id: contracts
    attributes:
      label: Affected repositories and contracts
      description: Identify upstream behavior, source paths, parent ownership, and required sub-issues.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and consequences
      description: Cover provenance, licensing, compatibility, operations, and publication constraints.
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation and adoption plan
    validations:
      required: true
